          <ul class="simples">${Object.entries(CLASSES).map(([e,a])=>`<li><b class="t-${e} num">${a.simbolo}</b> ${a.nome}</li>`).join("")}</ul>
          <p class="quieto pequeno" style="margin-top:8px">A nota (0 a 100) mede a qualidade das decis\xF5es, n\xE3o a sorte. 90+ quase sem erros; 75 a 89 boa; 60 a 74 erros relevantes; abaixo de 60 erros decisivos. N\xE3o existe um \u201CStockfish\u201D de Pok\xE9mon: \xE9 a leitura de um treinador. Para ela n\xE3o errar nas contas, o painel reconstr\xF3i o tabuleiro de cada turno a partir do log (HP, energias, pr\xEAmios, sua m\xE3o) e calcula o dano de cada ataque (com ferramentas, energias especiais, habilidades, est\xE1dio e as cartas jogadas no turno), os nocautes, o que daria com as cartas que estavam na sua m\xE3o e o que o oponente consegue fazer no turno seguinte. Depois, confere os n\xFAmeros que a an\xE1lise escreveu (dano, HP, pr\xEAmios, cartas na m\xE3o); se algum n\xE3o bater, o momento volta para revis\xE3o. Cada jogada marcada como erro passa ainda por uma segunda revis\xE3o, que procura o melhor argumento a favor da sua jogada antes de manter a cr\xEDtica. A an\xE1lise tamb\xE9m recebe a ficha do confronto, com a lista t\xEDpica do deck do oponente e o placar entre os dois decks nos torneios online da Limitless TCG, atualizada toda semana. Se discordar, clique em Discordo: a pr\xF3xima an\xE1lise confere o seu motivo com as contas do tabuleiro.</p></div>
        <div class="bloco"><h2 style="margin-bottom:10px">Diagn\xF3stico</h2><div id="diag" class="quieto pequeno">Carregando\u2026</div></div>
        <div class="bloco"><h2 style="margin-bottom:6px">Arquivos do programa</h2>
          <p class="quieto pequeno">A pasta do programa fica oculta para a pasta principal mostrar s\xF3 os dois atalhos. Se pedirem um registro (como o diagnostico.log), ele est\xE1 na pasta de dados.</p>
          <div class="linha-botoes"><button class="botao leve" id="abrir-dados" type="button">Abrir a pasta de dados</button><button class="botao leve" id="abrir-programa" type="button">Abrir a pasta do programa</button></div></div>
      </div>
    </div>`;for(const e of["dados","programa"])$(`#abrir-${e}`).onclick=async()=>{try{await api("POST","/api/abrir-pasta",{qual:e}),aviso("Abri a pasta numa janela do Windows (se n\xE3o aparecer na frente, olhe na barra de tarefas).")}catch(a){aviso(a.message)}};api("GET","/api/diagnostico").then(e=>{const a=`Linhas do Battle Log que o parser n\xE3o reconheceu (vers\xE3o do parser ${e.versaoParser}, ${e.partidas} partidas, cobertura m\xE9dia ${e.coberturaMedia??"\u2014"}%):
${e.desconhecidas.map(t=>`${t.vezes}x ${t.linha}`).join(`
`)}`;$("#diag").innerHTML=`<p>Vers\xE3o ${esc(e.versao)}; parser v${e.versaoParser}; ${e.cartasNaBase} cartas na base; Node ${esc(e.node)}.</p>
      <p>${e.fichas?`Fichas do meta: ${e.fichas.arquetipos} decks, ${e.fichas.torneios} torneios online da Limitless TCG, atualizadas em ${new Date(e.fichas.geradoEm).toLocaleDateString("pt-BR")}. Elas se atualizam sozinhas toda semana.`:"Fichas do meta: ainda n\xE3o baixadas. Elas chegam sozinhas quando o computador estiver na internet."}</p>
      <p>Linhas do log reconhecidas pelo parser: ${e.coberturaMedia??"\u2014"}% em m\xE9dia.</p>
      ${e.desconhecidas.length?'<div class="linha-botoes"><button class="botao leve" id="copiar-diag">Copiar linhas n\xE3o reconhecidas</button><button class="botao leve" id="reprocessar">Reprocessar partidas</button></div><p style="margin-top:8px">Se a leitura das partidas parecer errada, mande essas linhas para quem cuida do programa. J\xE1 v\xEAm sem os nicks.</p>':""}`,$("#copiar-diag")&&($("#copiar-diag").onclick=async()=>{await navigator.clipboard.writeText(a),aviso("Linhas copiadas.")},$("#reprocessar").onclick=async()=>{const t=await api("POST","/api/diagnostico/reprocessar",{});aviso(`${t.reprocessadas} partidas reprocessadas.`)})}).catch(()=>{})}renderizar();
</script>
